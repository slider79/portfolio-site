<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760">
<!-- UMD, the disc the machine in section 02 actually takes. Ink on paper for
     the same reason as floppy.svg: CSS does the cutting out. -->
<defs>
  <pattern id="uht" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
    <circle cx="3.5" cy="3.5" r="1.4" fill="#111"/>
  </pattern>
  <radialGradient id="disc" cx="42%" cy="36%">
    <stop offset="0" stop-color="#fff"/>
    <stop offset="1" stop-color="#fff"/>
  </radialGradient>
</defs>

<rect width="760" height="760" fill="#fff"/>

<g transform="translate(380 380) rotate(14) translate(-380 -380)">
  <!-- caddy -->
  <path d="M196 176h368a20 20 0 0 1 20 20v300a88 88 0 0 1-88 88H264a88 88 0 0 1-88-88V196a20 20 0 0 1 20-20z"
        fill="#fff" stroke="#111" stroke-width="9"/>
  <path d="M196 176h368a20 20 0 0 1 20 20v300a88 88 0 0 1-88 88H264a88 88 0 0 1-88-88V196a20 20 0 0 1 20-20z"
        fill="url(#uht)" opacity=".42"/>

  <!-- window, through which the disc is visible -->
  <circle cx="380" cy="386" r="168" fill="#fff" stroke="#111" stroke-width="9"/>

  <!-- the disc -->
  <circle cx="380" cy="386" r="150" fill="url(#disc)" stroke="#111" stroke-width="6"/>
  <!-- data tracks -->
  <g fill="none" stroke="#111" stroke-width="3" opacity=".55">
    <circle cx="380" cy="386" r="136"/><circle cx="380" cy="386" r="122"/>
    <circle cx="380" cy="386" r="108"/><circle cx="380" cy="386" r="94"/>
    <circle cx="380" cy="386" r="80"/><circle cx="380" cy="386" r="66"/>
  </g>
  <!-- the sheen every optical disc has, as a hard-edged wedge -->
  <path d="M380 236a150 150 0 0 0-106 44l30 30a108 108 0 0 1 76-31z" fill="#111" opacity=".22"/>
  <!-- hub -->
  <circle cx="380" cy="386" r="52" fill="#fff" stroke="#111" stroke-width="8"/>
  <circle cx="380" cy="386" r="24" fill="#fff" stroke="#111" stroke-width="8"/>
  <g stroke="#111" stroke-width="6">
    <path d="M380 334v-18M380 456v18M328 386h-18M432 386h18"/>
  </g>

  <!-- spine label -->
  <rect x="212" y="196" width="204" height="46" rx="5" fill="#fff" stroke="#111" stroke-width="7"/>
  <g stroke="#111" stroke-width="6" stroke-linecap="round">
    <path d="M232 212h164M232 228h108"/>
  </g>

  <!-- caddy notches -->
  <path d="M176 300h-22v56h22M584 300h22v56h-22" fill="#fff" stroke="#111" stroke-width="8"/>
</g>
</svg>
